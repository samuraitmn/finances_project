
name: Project CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install .
        working-directory: riskguard

      - name: Run evaluation
        run: python -m riskguard.evaluate --scenarios data/scenarios.json --output artifacts
        working-directory: riskguard

      - name: Verify report
        run: python -m riskguard.verify_report artifacts/evaluation.json
        working-directory: riskguard

      - name: Upload evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: riskguard-evaluation-report
          path: |
            riskguard/artifacts/evaluation.json
            riskguard/artifacts/evaluation.md
          if-no-files-found: error
